name: datacopilot

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: datacopilot-api
    env_file:
      - ../backend/.env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../backend/app:/app/app
      - ../backend/tests:/app/tests
      - ../backend/pytest.ini:/app/pytest.ini

  test:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    command: ["python", "-m", "pytest", "-v"]
    volumes:
      - ../backend/app:/app/app
      - ../backend/tests:/app/tests
      - ../backend/pytest.ini:/app/pytest.ini
      - ../sample_data:/app/sample_data
